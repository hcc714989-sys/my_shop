<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meri Dukaan</title>
<style>
body{font-family:sans-serif;margin:0;background:#f5f5f5}
.header{background:black;color:white;padding:15px;text-align:center;font-size:22px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:white;padding:12px;border-radius:12px;text-align:center}
.card img{width:100%;border-radius:10px}
.price{font-weight:bold;margin:8px 0}
.btn{background:#25D366;color:white;padding:10px;border:none;width:100%;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<div class="header">Meri Dukaan</div>
<div class="products">
<div class="card">
<img src="https://picsum.photos/seed/bag/300/300">
<div>Skyfinch Bag</div>
<div class="price">Rs 351</div>
<button class="btn" onclick="window.open('https://wa.me/919999999999?text=Mujhe Bag chahiye')">Order on WhatsApp</button>
</div>
<div class="card">
<img src="https://picsum.photos/seed/earphone/300/300">
<div>Earphone</div>
<div class="price">Rs 199</div>
<button class="btn" onclick="window.open('https://wa.me/919999999999?text=Mujhe Earphone chahiye')">Order on WhatsApp</button>
</div>
</div>
</body>
</html>
